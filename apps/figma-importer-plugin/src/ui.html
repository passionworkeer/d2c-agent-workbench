<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><title>D2C 活动页导入</title><style>
body { font-family: Inter, "PingFang SC", sans-serif; margin: 16px; color: #1a1a1a; font-size: 12px; } h2 { font-size: 14px; margin: 0 0 4px; } p { color: #666; line-height: 1.6; } label { display: block; margin: 12px 0; } button { padding: 8px 16px; margin-right: 8px; cursor: pointer; } button:disabled { opacity: .5; cursor: not-allowed; } #report { margin-top: 12px; line-height: 1.7; white-space: pre-wrap; } #report.error { color: #c0392b; }
</style></head><body>
<h2>D2C 活动页导入（离线）</h2><p>导入自包含 JSON 后，可从 Figma 根 Frame 导出 PNG，并与包内参考图生成本地 diff 和报告。插件不联网。</p>
<label>导入包 JSON：<input id="file" type="file" accept="application/json,.json" /></label>
<button id="import" disabled>导入到 Figma</button><button id="verify" disabled>导出并验证</button><div id="report"></div><script src="ui.js"></script>
</body></html>
